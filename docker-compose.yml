services:
  test-swift-dynamics:
    # ใช้ image version v2 ตามใน deployment
    image: oasisforsaken/test-swift-dynamics:v2
    container_name: test-swift-dynamics-app
    restart: always
    ports:
      # แมปพอร์ต 8100 (Service Port) เข้ากับ 3000 (Target/Container Port)
      - "8101:3000"
    environment:
      - NODE_ENV=production
    # กำหนดทรัพยากรให้ใกล้เคียงกับ K8s Limits
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

networks:
  default:
    name: test-swift-network
